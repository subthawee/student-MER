<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรายงานและติดตามผลการเรียน</title>
  <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1IftXXCnV0Nfk2MiClbke1umaqbcl_jh3&sz=w200" />
  <meta property="og:title" content="ระบบรายงานและติดตามผลการเรียน" />
  <meta property="og:description" content="ระบบรายงานและติดตามผลการเรียน โรงเรียนทรัพย์ทวี" />
  <meta property="og:image" content="https://drive.google.com/thumbnail?id=1IftXXCnV0Nfk2MiClbke1umaqbcl_jh3&sz=w1200" />
  <meta property="og:type" content="website" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap');

    body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
    h1, h2, h3, h4, h5, h6, .font-prompt { font-family: 'Prompt', sans-serif; }

    .slide-in { animation: slideIn 0.3s ease-out forwards; }
    @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .a4-scroll::-webkit-scrollbar { width: 8px; }
    .a4-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .a4-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    .a4-scroll::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    @media print {
      header, aside, footer, .no-print, .alert-modal { display: none !important; }
      body, html { background: white !important; padding: 0 !important; margin: 0 !important; }
      main, .print-wrapper, .print-container {
        display: block !important; width: 100% !important; height: auto !important;
        max-height: none !important; overflow: visible !important; padding: 0 !important; margin: 0 !important;
      }
      #printable-area { 
        position: static !important; width: 100% !important; height: auto !important;
        min-height: auto !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; 
      }
      @page { size: A4 portrait; margin: 1cm; }
      thead { display: table-header-group; }
      tfoot { display: table-footer-group; }
      tr, .break-inside-avoid { page-break-inside: avoid; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYSVku10SpSO3faAIv771kt02C7ZYmJ60vevTVa2o5oAYTBljc4oE2qRCD0evRn41hwg/exec';

    const colors = {
      pink: '#F055A5', lemon: '#FABE37', lime: '#CCD537', violet: '#7A88FE', orange: '#FF9B28', blue: '#BFDFF3'
    };

    const Icon = ({ name, size = 24, className = "" }) => {
      const svgContent = typeof feather !== 'undefined' && feather.icons[name] 
        ? feather.icons[name].toSvg({ width: size, height: size, class: className }) : '';
      return <span dangerouslySetInnerHTML={{ __html: svgContent }} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} />;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [appState, setAppState] = useState({ isLoading: false, error: null });
      const [settings, setSettings] = useState({ 
        year: '', term: '', 
        isRecordMSOpen: true, isRecordElTimeOpen: true, isRecordRMsOpen: true, isRecord0Open: true, isPrintOpen: true 
      });
      const [dbData, setDbData] = useState({ 
        students: [], subjects: [], grades: [], users: [],
        elStudents: [], elSubjects: [], elTime: [] 
      });

      const fetchAPI = async (action, payload = {}) => {
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST', body: JSON.stringify({ action, ...payload })
          });
          const result = await response.json();
          if (!result.success) throw new Error(result.message || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์');
          return result.data;
        } catch (error) {
          console.error("API Error:", error);
          throw new Error('ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง');
        }
      };

      const handleLogin = async (credentials) => {
        setAppState({ isLoading: true, error: null });
        try {
          if (credentials.role === 'Admin' && credentials.password === 'mer69') {
            setUser({ role: 'Admin', name: 'ผู้ดูแลระบบ', username: 'admin' });
            await loadInitialData();
            return;
          }
          const data = await fetchAPI('login', credentials);
          if (data.user) {
            setUser(data.user);
            await loadInitialData();
          } else {
            throw new Error('รหัสผ่านหรือข้อมูลไม่ถูกต้อง');
          }
        } catch (err) {
          setAppState({ isLoading: false, error: err.message });
        }
      };

      const loadInitialData = async () => {
        try {
          const data = await fetchAPI('getInitialData');
          
          const parsedSettings = { ...data.settings };
          Object.keys(parsedSettings).forEach(key => {
            if(parsedSettings[key] === 'true') parsedSettings[key] = true;
            if(parsedSettings[key] === 'false') parsedSettings[key] = false;
          });
          if(parsedSettings.isRecordMSOpen === undefined) parsedSettings.isRecordMSOpen = true;
          if(parsedSettings.isRecordElTimeOpen === undefined) parsedSettings.isRecordElTimeOpen = true;
          if(parsedSettings.isRecordRMsOpen === undefined) parsedSettings.isRecordRMsOpen = true;
          if(parsedSettings.isRecord0Open === undefined) parsedSettings.isRecord0Open = true;

          setSettings(parsedSettings);
          setDbData({
            students: data.students || [],
            subjects: data.subjects || [],
            grades: data.grades || [],
            users: data.users || [],
            elStudents: data.elStudents || [],
            elSubjects: data.elSubjects || [],
            elTime: data.elTime || []
          });
          setAppState({ isLoading: false, error: null });
        } catch (err) {
          setAppState({ isLoading: false, error: 'กำลังเชื่อมต่อระบบ กรุณารอการตั้งค่าจากผู้ดูแล' });
        }
      };

      const handleLogout = () => {
        setUser(null);
        setDbData({ students: [], subjects: [], grades: [], users: [], elStudents: [], elSubjects: [], elTime: [] });
      };

      const reloadData = async () => {
        try {
            const data = await fetchAPI('getInitialData');
            setDbData(prev => ({
                ...prev,
                grades: data.grades || [],
                elTime: data.elTime || []
            }));
        } catch(e) { console.error("Reload error", e); }
      }

      if (!user) return <LoginScreen onLogin={handleLogin} isLoading={appState.isLoading} error={appState.error} />;

      return (
        <MainLayout user={user} onLogout={handleLogout} settings={settings} dbData={dbData} fetchAPI={fetchAPI} setSettings={setSettings} reloadData={reloadData} />
      );
    }

    function LoginScreen({ onLogin, isLoading, error }) {
      const [role, setRole] = useState('Teacher');
      const [password, setPassword] = useState('');
      const submit = (e) => { e.preventDefault(); onLogin({ role, password }); };

      return (
        <div className="min-h-screen flex items-center justify-center bg-[#f3f4f6] font-sans p-4 md:p-12">
          <div className="bg-white rounded-[2rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.2)] max-w-6xl w-[92%] flex flex-col md:flex-row overflow-hidden min-h-0 md:min-h-[500px] border border-gray-100 slide-in">
            <div className="w-full md:w-1/2 h-[320px] md:h-auto relative overflow-hidden flex flex-col justify-between p-4 md:p-10">
              <div className="absolute inset-0 bg-cover bg-center transition-transform duration-1000 hover:scale-105" style={{ backgroundImage: "url('https://lh3.googleusercontent.com/d/1kWb3n5n5y5S1HrxjUeXuJzZIC6HE3BAe')" }} />
              <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-black/40 to-transparent" />
              
              <div className="relative z-10 text-left text-white fade-in mt-1">
                <h1 className="font-bold tracking-tight mb-2 drop-shadow-lg leading-tight font-sans" style={{ fontSize: "clamp(1.5rem, 3vw, 2.25rem)" }}>
                  ระบบรายงานและติดตาม<br/>ความก้าวหน้าผลการเรียน
                </h1>
                <p className="text-white/80 text-base md:text-lg drop-shadow-md font-sans">โรงเรียนทรัพย์ทวี</p>
              </div>

              <div className="relative z-10 mt-auto fade-in" style={{animationDelay: '0.2s'}}>
                <div className="grid grid-cols-3 gap-2 md:gap-3 mb-2 md:mb-4">
                  <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-3 text-left transition-all hover:-translate-y-1.5 hover:bg-white/20 hover:shadow-lg cursor-default shadow-sm">
                    <Icon name="file-text" size={18} className="text-white mb-2" />
                    <h3 className="text-white font-medium text-[12px] md:text-[16px] mb-1">บันทึกผล<br/>ของผู้เรียน</h3>
                    <p className="text-gray-200 text-[8px] md:text-[12px] leading-tight font-light">จัดเก็บคะแนนและผลการประเมินอย่างรวดเร็ว</p>
                  </div>
                  <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-3 text-left transition-all hover:-translate-y-1.5 hover:bg-white/20 hover:shadow-lg cursor-default shadow-sm">
                    <Icon name="pie-chart" size={18} className="text-white mb-2" />
                    <h3 className="text-white font-medium text-[12px] md:text-[16px] mb-1">ภาพรวม</h3>
                    <p className="text-gray-200 text-[8px] md:text-[12px] leading-tight font-light">วิเคราะห์ภาพรวมการเรียนแบบเรียลไทม์</p>
                  </div>
                  <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-3 text-left transition-all hover:-translate-y-1.5 hover:bg-white/20 hover:shadow-lg cursor-default shadow-sm">
                    <Icon name="database" size={18} className="text-white mb-2" />
                    <h3 className="text-white font-medium text-[12px] md:text-[16px] mb-1">จัดการข้อมูลอย่างเป็นระบบ</h3>
                    <p className="text-gray-200 text-[8px] md:text-[12px] leading-tight font-light">บริหารจัดการผู้ใช้และข้อมูลหลักได้ครบถ้วน</p>
                  </div>
                </div>
                <div className="text-center w-full">
                  <p className="text-white/70 text-[10px]">© 2026 ระบบรายงานและติดตามความก้าวหน้าผลการเรียน</p>
                  <p className="text-white/70 text-[10px]">พัฒนาและออกแบบเพื่อการใช้งานในสถานศึกษา สงวนลิขสิทธิ์</p>
                </div>
              </div>
            </div>

            <div className="w-full md:w-1/2 flex items-center justify-center p-8 md:p-12 bg-white relative">
              <div className="w-full max-w-[380px] fade-in" style={{animationDelay: '0.3s'}}>
                <div className="text-center mb-2">
                  <h2 className="text-3xl font-bold text-gray-700 mb-2 md:mb-4">เข้าสู่ระบบ</h2>
                  <p className="text-gray-500 text-sm mb-6 md:mb-8">กรุณาเลือกประเภทผู้ใช้งานและรหัสผ่าน</p>
                </div>
                {error && (
                  <div className="mb-6 p-4 rounded-xl bg-red-50 text-red-600 text-sm flex items-start border border-red-100 animate-pulse">
                    <Icon name="alert-circle" size={18} className="mr-2 flex-shrink-0 mt-0.5" /><span>{error}</span>
                  </div>
                )}
                <form onSubmit={submit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">ประเภทผู้ใช้งาน</label>
                    <div className="relative group">
                      <select className="w-full appearance-none px-5 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-[#7A88FE]/20 focus:border-[#7A88FE] transition-all text-gray-700 font-bold cursor-pointer outline-none" value={role} onChange={(e) => setRole(e.target.value)}>
                        <option value="Teacher">ครูผู้สอน</option>
                        <option value="Director">ผู้อำนวยการ</option>
                        <option value="Admin">ผู้ดูแลระบบ</option>
                      </select>
                      <div className="absolute right-3 top-1/2 transform -translate-y-1/2 w-8 h-8 bg-white rounded-lg flex items-center justify-center shadow-sm pointer-events-none group-hover:bg-[#7A88FE]/10 transition-colors">
                        <Icon name="chevron-down" className="text-gray-400 group-hover:text-[#7A88FE]" size={18} />
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">รหัสผ่าน</label>
                    <input type="password" className="w-full px-5 py-3.5 rounded-xl border-2 border-gray-100 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-[#7A88FE]/20 focus:border-[#7A88FE] transition-all font-medium outline-none" placeholder="กรอกรหัสผ่านของคุณ" value={password} onChange={(e) => setPassword(e.target.value)} required />
                  </div>
                  <button type="submit" disabled={isLoading} className={`w-full py-4 rounded-xl text-white font-bold shadow-[0_8px_20px_rgba(122,136,254,0.3)] transition-all flex justify-center items-center gap-2 mt-8 text-lg ${isLoading ? 'bg-gray-400 cursor-not-allowed shadow-none' : 'bg-[#7A88FE] hover:bg-[#6574f0] hover:-translate-y-1 hover:shadow-[0_15px_25px_rgba(122,136,254,0.4)]'}`}>
                    {isLoading ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : 'เข้าสู่ระบบ'}
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function MainLayout({ user, onLogout, settings, dbData, fetchAPI, setSettings, reloadData }) {
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [currentRoute, setCurrentRoute] = useState('dashboard');
      const [alertMsg, setAlertMsg] = useState(null);

      const showAlert = (title, message, type = 'info', onConfirm = null) => {
        setAlertMsg({ title, message, type, onConfirm });
      };

      const navItems = [
        { id: 'dashboard', label: 'สรุปภาพรวม / ประวัติ', icon: 'home', roles: ['Admin', 'Teacher', 'Director'] },
        { id: 'record-ms', label: 'บันทึกผลนักเรียนติด มส', icon: 'file-text', roles: ['Teacher'] },
        { id: 'record-el-time', label: 'สรุปเวลาเรียนระดับประถมศึกษา', icon: 'clock', roles: ['Teacher'] },
        { id: 'record-r-ms', label: 'ยืนยันผลการเรียน ร มส', icon: 'check-square', roles: ['Teacher'] },
        { id: 'record-0', label: 'ยืนยันผลการเรียนติด 0', icon: 'check-circle', roles: ['Teacher'] },
        { id: 'reports', label: 'ระบบพิมพ์รายงาน', icon: 'printer', roles: ['Admin', 'Teacher', 'Director'] },
        { id: 'admin', label: 'ตั้งค่าระบบ', icon: 'settings', roles: ['Admin'] },
      ];

      const allowedNavItems = navItems.filter(item => item.roles.includes(user.role));

      return (
        <div className="min-h-screen bg-[#f3f4f6] flex flex-col font-sans">
          <header className="bg-white shadow-sm z-20 relative px-4 py-3 flex items-center justify-between no-print">
            <div className="flex items-center gap-4">
              <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition-colors"><Icon name="menu" /></button>
              <div>
                <h1 className="text-xl font-semibold text-gray-800 leading-tight">งานวัดและประเมินผล</h1>
                <h2 className="text-sm text-gray-500">ฝ่ายบริหารวิชาการ โรงเรียนทรัพย์ทวี</h2>
                <p className="text-[10px] text-gray-400 whitespace-nowrap">สำนักงานเขตพื้นที่การศึกษาประถมศึกษาสุราษฎร์ธานี เขต 3</p>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <div className="hidden md:block text-right mr-2">
                <p className="text-sm font-semibold text-gray-700">{user.name}</p>
                <span className={`text-xs px-2 py-0.5 rounded-full ${user.role === 'Admin' ? 'bg-[#7A88FE]/10 text-[#7A88FE]' : user.role === 'Teacher' ? 'bg-[#F055A5]/10 text-[#F055A5]' : 'bg-[#FABE37]/10 text-[#FABE37]'}`}>
                  {user.role === 'Admin' ? 'ผู้ดูแลระบบ' : user.role === 'Teacher' ? 'ครูผู้สอน' : 'ผู้อำนวยการ'}
                </span>
              </div>
              <button onClick={onLogout} className="p-2.5 rounded-full text-red-500 hover:bg-red-50 transition-colors tooltip" title="ออกจากระบบ"><Icon name="log-out" size={20} /></button>
            </div>
          </header>

          {isSidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 no-print backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)} />}
          
          <aside className={`fixed top-0 left-0 h-full w-72 bg-white shadow-2xl z-40 transform transition-transform duration-300 ease-in-out no-print ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="p-6 border-b border-gray-100 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-[#7A88FE]/10 flex items-center justify-center text-[#7A88FE]"><Icon name="settings" size={22} /></div>
                <span className="font-bold text-gray-800">เมนูระบบ</span>
              </div>
              <button onClick={() => setIsSidebarOpen(false)} className="p-1 text-gray-400 hover:text-gray-700"><Icon name="x-circle" size={20}/></button>
            </div>
            <nav className="p-4 space-y-1">
              {allowedNavItems.map(item => (
                <button key={item.id} onClick={() => { setCurrentRoute(item.id); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-sm font-medium ${currentRoute === item.id ? 'bg-[#7A88FE] text-white shadow-md shadow-[#7A88FE]/30' : 'text-gray-600 hover:bg-gray-50 hover:text-[#7A88FE]'}`}>
                  <Icon name={item.icon} size={18} /> {item.label}
                </button>
              ))}
            </nav>
          </aside>

          <main className="flex-1 overflow-auto p-4 md:p-6 lg:p-8 w-full max-w-7xl mx-auto relative z-10">
            <div className="fade-in">
              {currentRoute === 'dashboard' && <Dashboard dbData={dbData} user={user} />}
              {currentRoute === 'record-ms' && <RecordSystem type="ms" isOpen={settings.isRecordMSOpen} settings={settings} dbData={dbData} user={user} showAlert={showAlert} fetchAPI={fetchAPI} reloadData={reloadData} />}
              {currentRoute === 'record-el-time' && <RecordElTime isOpen={settings.isRecordElTimeOpen} settings={settings} dbData={dbData} user={user} showAlert={showAlert} fetchAPI={fetchAPI} reloadData={reloadData} />}
              {currentRoute === 'record-r-ms' && <RecordSystem type="r-ms" isOpen={settings.isRecordRMsOpen} settings={settings} dbData={dbData} user={user} showAlert={showAlert} fetchAPI={fetchAPI} reloadData={reloadData} />}
              {currentRoute === 'record-0' && <RecordSystem type="0" isOpen={settings.isRecord0Open} settings={settings} dbData={dbData} user={user} showAlert={showAlert} fetchAPI={fetchAPI} reloadData={reloadData} />}
              {currentRoute === 'reports' && <ReportsSystem isOpen={settings.isPrintOpen} settings={settings} dbData={dbData} showAlert={showAlert} />}
              {currentRoute === 'admin' && user.role === 'Admin' && <AdminSettings settings={settings} setSettings={setSettings} dbData={dbData} fetchAPI={fetchAPI} showAlert={showAlert} />}
            </div>
          </main>

          <footer className="bg-white border-t border-gray-200 py-4 text-center no-print mt-auto">
            <p className="text-[10px] text-gray-400">© 2026 ระบบรายงานและติดตามความก้าวหน้าผลการเรียน</p>
            <p className="text-[10px] text-gray-400">พัฒนาและออกแบบเพื่อการใช้งานในสถานศึกษา สงวนลิขสิทธิ์</p>
          </footer>

          {alertMsg && <AlertModal {...alertMsg} onClose={() => setAlertMsg(null)} />}
        </div>
      );
    }

    function Dashboard({ dbData, user }) {
      const [viewMode, setViewMode] = useState('overview'); 

      const totalStudents = dbData.students?.length || 0;
      const failingGrades = (dbData.grades || []).filter(g => ['0', 'ร', 'มส 60%', 'มส 80%', 'มส'].includes(g.status) || ['0', 'ร', 'มส 60%', 'มส 80%', 'มส'].includes(g.statusR) || ['0', 'ร', 'มส 60%', 'มส 80%', 'มส'].includes(g.statusMS));
      const uniqueFailingStudentIds = new Set(failingGrades.map(g => g.studentId));
      const totalFails = uniqueFailingStudentIds.size;
      const totalPass = Math.max(0, totalStudents - totalFails);

      const fail0 = failingGrades.filter(g => g.status === '0' || g.statusR === '0' || g.statusMS === '0').length;
      const failR = failingGrades.filter(g => g.status === 'ร' || g.statusR === 'ร' || g.statusMS === 'ร').length;
      const failMS = failingGrades.filter(g => (g.status && g.status.includes('มส')) || (g.statusMS && g.statusMS.includes('มส'))).length;

      const gradeCounts = {'ม.1': 0, 'ม.2': 0, 'ม.3': 0, 'ม.4': 0, 'ม.5': 0, 'ม.6': 0};
      (dbData.students || []).forEach(s => {

      const totalElStudents = dbData.elStudents?.length || 0;
      const elGradeCounts = {'ป.1': 0, 'ป.2': 0, 'ป.3': 0, 'ป.4': 0, 'ป.5': 0, 'ป.6': 0};
      (dbData.elStudents || []).forEach(s => {
        if (elGradeCounts[s.grade] !== undefined) elGradeCounts[s.grade]++;
      });
      const maxElGradeCount = Math.max(...Object.values(elGradeCounts), 1);

      const myRecentGrades = (dbData.grades || []).filter(g => g.teacher === user.name);
      const myRecentElTime = (dbData.elTime || []).filter(t => t.teacher === user.name);
      
      const uniqueActivities = [];

                  const subName = (dbData.subjects || []).find(s=>s.id === g.subjectId)?.name || g.subjectId;

                  <div className="flex flex-wrap md:flex-nowrap justify-between items-center text-[10px] md:text-sm relative z-10 bg-white/20 p-2 md:p-2.5 rounded-xl backdrop-blur-sm gap-1 md:gap-0">

                    <span className="flex items-center gap-1 md:gap-1.5 text-white font-medium"><div className="w-1.5 h-1.5 md:w-2.5 md:h-2.5 rounded-full bg-white shadow-sm"></div> ร: {failR}</span>
                    <span className="flex items-center gap-1 md:gap-1.5 text-white font-medium"><div className="w-1.5 h-1.5 md:w-2.5 md:h-2.5 rounded-full bg-white shadow-sm"></div> มส: {failMS}</span>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                  <h3 className="text-lg font-bold text-gray-800 mb-6">จำนวนนักเรียนแยกตามระดับชั้น (มัธยม)</h3>
                  <div className="h-64 flex items-end justify-around gap-2 pt-10">
                    {Object.keys(gradeCounts).map((grade, idx) => {
                      const count = gradeCounts[grade];
                      const chartMax = Math.ceil(maxGradeCount / 10) * 10;
                      const heightPct = chartMax === 0 ? 0 : (count / chartMax) * 100;

                          <div className="relative w-full max-w-[40px] h-56 flex items-end justify-center">

                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">

                     <StatCard title="นักเรียนทั้งหมด (ประถม)" value={totalElStudents} color={colors.blue} icon="users" textColor="text-gray-700" />
                     <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex-1 flex flex-col justify-center transition-all hover:shadow-lg hover:-translate-y-1">
                        <div className="flex items-center gap-4 mb-2">

                  <div className="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">

                              <div className="w-full rounded-t-lg transition-all duration-500 group-hover:opacity-80 shadow-sm" style={{ height: `${heightPct}%`, minHeight: count > 0 ? '15px' : '0px', backgroundColor: colors.blue }}></div>

                            <span className="text-xs text-gray-500 mt-3 font-medium">{grade}</span>

                      })}

                  </div>
                </div>
              </div>

              <div className="mt-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                  <h3 className="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2"><Icon name="check-square" className="text-[#FF9B28]"/> วิชาที่คุณบันทึกข้อมูลแล้ว</h3>

                  {uniqueActivities.length > 0 ? (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {uniqueActivities.map((act, idx) => (
                              <div key={idx} className="flex items-center p-3 rounded-xl border border-gray-100 bg-gray-50 hover:bg-white hover:shadow-md transition-all">
                                  <div className={`w-12 h-12 rounded-lg flex items-center justify-center font-bold text-white mr-4 shadow-sm shrink-0 ${act.type === 'ประถม' ? 'bg-[#CCD537]' : 'bg-[#F055A5]'}`}>

    function StatCard({ title, value, color, icon, textColor="text-white" }) {
      return (
        <div className="rounded-2xl p-4 md:p-5 shadow-md flex flex-col md:flex-row items-center gap-2 md:gap-4 relative overflow-hidden group transition-all hover:shadow-lg hover:-translate-y-1" style={{ backgroundColor: color }}>
          <div className="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-white opacity-10 transition-transform duration-500 group-hover:scale-[1.8]"></div>
          <div className={`w-10 h-10 md:w-14 md:h-14 shrink-0 rounded-xl md:rounded-2xl flex items-center justify-center shadow-inner z-10 bg-white/20 backdrop-blur-sm ${textColor}`}><Icon name={icon} /></div>
          <div className={`z-10 text-center md:text-left w-full ${textColor}`}>
            <p className="text-[10px] md:text-sm font-semibold mb-0.5 md:mb-1 line-clamp-1 opacity-90">{title}</p>
            <h3 className="text-xl md:text-3xl font-bold drop-shadow-sm">{value}</h3>

    function TeacherHistory({ dbData, user }) {
        const [filter, setFilter] = useState('ms'); 
        const [gradeFilter, setGradeFilter] = useState('ทั้งหมด');
        
        const myGrades = (dbData.grades || []).filter(g => g.teacher === user.name);
        const myElTime = (dbData.elTime || []).filter(t => t.teacher === user.name);

        const allGrades = ['ทั้งหมด', 'ป.1', 'ป.2', 'ป.3', 'ป.4', 'ป.5', 'ป.6', 'ม.1', 'ม.2', 'ม.3'];

        let displayData = [];
        let cols = [];

        const getStudentInfo = (id) => {
            let st = dbData.students.find(s => String(s.id) === String(id));
            if(st) return st;
            st = dbData.elStudents.find(s => String(s.id) === String(id));
            if(st) return st;
            return { name: 'ไม่พบชื่อ', grade: '' };
        }

        let rawData = [];
        if(filter === 'ms') {
            rawData = myGrades.filter(g => g.status === 'มส 60%' || g.status === 'มส 80%' || g.status === 'ผ่านเกณฑ์');
            cols = ['ปี/เทอม', 'รหัสวิชา', 'รหัสนร.', 'ชื่อนักเรียน', 'ชั้น', 'สถานะ', 'หมายเหตุ'];
        } else if (filter === 'r-ms') {
            rawData = myGrades.filter(g => g.statusR || g.statusMS || g.statusFinal);
            cols = ['ปี/เทอม', 'รหัสวิชา', 'รหัสนร.', 'ชื่อนักเรียน', 'ชั้น', 'ร', 'มส', 'สรุป'];
        } else if (filter === '0') {
            rawData = myGrades.filter(g => g.status === '0' || g.status === 'ปกติ');
            cols = ['ปี/เทอม', 'รหัสวิชา', 'รหัสนร.', 'ชื่อนักเรียน', 'ชั้น', 'ผลการเรียน'];
        } else if (filter === 'eltime') {
            rawData = myElTime.map(t => ({...t, sGrade: t.grade}));
            cols = ['ปี/เทอม', 'วิชา', 'รหัสนร.', 'ชื่อนักเรียน', 'ชั้น', 'มาเรียน(%)', 'หมายเหตุ'];
        }

        displayData = rawData.map(row => {
            if(filter !== 'eltime') {
                const info = getStudentInfo(row.studentId);
                return { ...row, studentName: info.name, sGrade: info.grade };
            }
            return row;
        });

        if(gradeFilter !== 'ทั้งหมด') {
            displayData = displayData.filter(d => d.sGrade === gradeFilter);
        }

        return (
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 fade-in">
                <div className="flex flex-wrap gap-2 mb-4">
                    <button onClick={()=>{setFilter('ms'); setGradeFilter('ทั้งหมด');}} className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${filter === 'ms' ? 'bg-[#F055A5] text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>บันทึก มส</button>
                    <button onClick={()=>{setFilter('r-ms'); setGradeFilter('ทั้งหมด');}} className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${filter === 'r-ms' ? 'bg-[#FF9B28] text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>แก้ ร มส</button>
                    <button onClick={()=>{setFilter('0'); setGradeFilter('ทั้งหมด');}} className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${filter === '0' ? 'bg-[#7A88FE] text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>แก้ 0</button>
                    <button onClick={()=>{setFilter('eltime'); setGradeFilter('ทั้งหมด');}} className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${filter === 'eltime' ? 'bg-[#CCD537] text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>เวลาเรียนประถม</button>
                </div>

                <div className="flex flex-wrap gap-2 mb-6 p-3 bg-gray-50 rounded-xl border border-gray-100">
                    <span className="text-sm font-bold text-gray-700 flex items-center mr-2"><Icon name="filter" size={16} className="mr-1" /> ระดับชั้น:</span>
                    {allGrades.map(g => {
                        if(filter === 'eltime' && g.includes('ม.')) return null;
                        if(filter !== 'eltime' && g.includes('ป.')) return null;
                        
                        return (
                            <button key={g} onClick={()=>setGradeFilter(g)} className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-all ${gradeFilter === g ? 'bg-gray-800 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-100'}`}>
                                {g}
                            </button>
                        )
                    })}
                </div>

                <div className="overflow-x-auto">
                    <table className="w-full min-w-[800px] text-left border-collapse text-sm">
                        <thead>
                            <tr className="bg-gray-50 text-gray-600 border-b border-gray-200">
                                <th className="p-3 w-16">#</th>
                                {cols.map(c => <th key={c} className="p-3 whitespace-nowrap">{c}</th>)}
                            </tr>
                        </thead>
                        <tbody>
                            {displayData.length > 0 ? displayData.map((row, idx) => (
                                <tr key={idx} className="border-b border-gray-50 hover:bg-gray-50/50">
                                    <td className="p-3 text-gray-500">{idx+1}</td>
                                    <td className="p-3 text-gray-500 whitespace-nowrap">{row.year}/{row.term}</td>
                                    
                                    {filter !== 'eltime' && (
                                        <>
                                            <td className="p-3 text-gray-700 font-medium">{row.subjectId}</td>
                                            <td className="p-3 text-gray-500">{row.studentId}</td>
                                            <td className="p-3 text-gray-700">{row.studentName}</td>
                                            <td className="p-3 text-gray-500 text-center">{row.sGrade}</td>
                                        </>
                                    )}

                                    {filter === 'ms' && <><td className="p-3"><span className={`px-2 py-1 rounded-md text-xs ${row.status.includes('มส') ? 'bg-pink-100 text-pink-700' : 'bg-lime-100 text-lime-700'}`}>{row.status}</span></td><td className="p-3 text-gray-500">{row.note}</td></>}
                                    {filter === 'r-ms' && <><td className="p-3">{row.statusR}</td><td className="p-3">{row.statusMS}</td><td className="p-3 font-bold">{row.statusFinal}</td></>}
                                    {filter === '0' && <td className="p-3 font-bold">{row.status}</td>}
                                    
                                    {filter === 'eltime' && (
                                        <>
                                            <td className="p-3 text-gray-700 font-medium">{row.subjectName}</td>
                                            <td className="p-3 text-gray-500">{row.studentId}</td>
                                            <td className="p-3 text-gray-700">{row.studentName}</td>
                                            <td className="p-3 text-gray-500 text-center">{row.sGrade}</td>
                                            <td className="p-3 font-bold text-[#7A88FE]">{row.present} ({row.percent}%)</td>
                                            <td className="p-3 text-gray-500">{row.note}</td>
                                        </>
                                    )}
                                </tr>
                            )) : <tr><td colSpan={cols.length + 1} className="p-6 text-center text-gray-400">ไม่พบประวัติการบันทึกของคุณในหมวดหมู่นี้</td></tr>}
                        </tbody>
                    </table>
                </div>
            </div>
        )
    }

    function RecordSystem({ type, isOpen, settings, dbData, user, showAlert, fetchAPI, reloadData }) {
      const [grade, setGrade] = useState('');
      const [subjectId, setSubjectId] = useState('');
      const [formData, setFormData] = useState({});
      const [isSaving, setIsSaving] = useState(false);
      const [hasExistingData, setHasExistingData] = useState(false);

      if (!isOpen) {
        return (
          <div className="bg-white rounded-2xl p-10 text-center shadow-sm border border-gray-100">
            <Icon name="lock" size={48} className="mx-auto text-gray-300 mb-4" />
            <h2 className="text-2xl font-bold text-gray-700 mb-2">เมนูนี้ถูกปิดใช้งานชั่วคราว</h2>
            <p className="text-gray-500">ผู้ดูแลระบบได้ปิดการบันทึกข้อมูลส่วนนี้ กรุณาติดต่อฝ่ายวิชาการ</p>
          </div>
        );
      }

      const titleMap = { 'ms': 'บันทึกผลนักเรียนติด มส', 'r-ms': 'ยืนยันผลการเรียน ร มส', '0': 'ยืนยันผลการเรียนติด 0' };
      const gradeOptions = [...new Set((dbData.subjects || []).map(s => s.grade))].sort();
      const filteredSubjects = (dbData.subjects || []).filter(s => s.grade === grade);
      const displayStudents = (dbData.students || []).filter(s => s.grade === grade);

      useEffect(() => {
          if(grade && subjectId) {
              const existingRecords = (dbData.grades || []).filter(g => 
                  String(g.year) === String(settings.year) && 
                  String(g.term) === String(settings.term) && 
                  String(g.subjectId) === String(subjectId)
              );
              
              if(existingRecords.length > 0) {
                  setHasExistingData(true);
                  let prefill = {};
                  existingRecords.forEach(r => {
                      prefill[r.studentId] = {
                          status: r.status || '', note: r.note || '',
                          statusR: r.statusR || '', statusMS: r.statusMS || '', statusFinal: r.statusFinal || ''
                      };
                  });
                  setFormData(prefill);
              } else {
                  setHasExistingData(false);
                  setFormData({});
              }
          }
      }, [grade, subjectId, dbData.grades, settings.year, settings.term]);

      const handleStudentChange = (studentId, field, value) => {
        setFormData(prev => ({ ...prev, [studentId]: { ...prev[studentId], [field]: value } }));
      };

      const handleSave = () => {
        if (!grade || !subjectId) return showAlert('แจ้งเตือน', 'กรุณาเลือกระดับชั้นและรายวิชาก่อนบันทึก', 'error');
        const recordsCount = Object.keys(formData).length;
        if (recordsCount === 0) return showAlert('แจ้งเตือน', 'คุณยังไม่ได้ทำรายการใดๆ', 'error');

        const confirmMsg = hasExistingData 
            ? `คุณต้องการอัปเดตข้อมูลใช่หรือไม่?` 
            : `คุณต้องการบันทึกข้อมูลจำนวน ${recordsCount} รายการ ใช่หรือไม่?`;

        showAlert('ยืนยันการบันทึก', confirmMsg, 'info', async () => {
          setIsSaving(true);
          try {
            const payload = Object.entries(formData).map(([sId, data]) => ({
              year: settings.year, term: settings.term, teacher: user.name, subjectId, studentId: sId, ...data
            }));
            await fetchAPI('saveGrades', { data: payload });
            showAlert('สำเร็จ', 'บันทึกข้อมูลลงในระบบเรียบร้อยแล้ว', 'success');
            await reloadData();
          } catch (err) {
            showAlert('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกได้', 'error');
          } finally {
            setIsSaving(false);
          }
        });
      };

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div className="bg-[#7A88FE]/5 p-6 border-b border-gray-100 flex justify-between items-center">
            <div>
              <h2 className="text-xl font-bold text-[#7A88FE]">{titleMap[type]}</h2>
              <p className="text-sm text-gray-500 mt-1">ปีการศึกษา {settings.year} ภาคเรียนที่ {settings.term} | ครูผู้สอน: {user.name}</p>
            </div>
            {hasExistingData && <span className="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-xs font-bold border border-orange-200">มีข้อมูลในระบบแล้วสามารถแก้ไขได้</span>}
          </div>

          <div className="p-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-3">เลือกระดับชั้น</label>
                <div className="relative group">
                  <select className="w-full appearance-none px-5 py-4 rounded-xl border-2 border-gray-100 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-[#7A88FE]/20 focus:border-[#7A88FE] transition-all text-gray-700 font-bold cursor-pointer outline-none hover:border-gray-200" value={grade} onChange={e => {setGrade(e.target.value); setSubjectId(''); setFormData({});}}>
                    <option value="">-- เลือกระดับชั้น --</option>
                    {gradeOptions.map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                  <div className="absolute right-4 top-1/2 transform -translate-y-1/2 w-8 h-8 bg-white rounded-lg flex items-center justify-center shadow-sm pointer-events-none group-hover:bg-[#7A88FE]/10 transition-colors">
                    <Icon name="chevron-down" className="text-gray-400 group-hover:text-[#7A88FE]" size={18} />
                  </div>
                </div>
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-3">เลือกรายวิชา</label>
                <div className="relative group">
                  <select className={`w-full appearance-none px-5 py-4 rounded-xl border-2 transition-all font-bold outline-none ${!grade ? 'border-gray-100 bg-gray-100 text-gray-400 cursor-not-allowed' : 'border-gray-100 bg-gray-50 hover:border-gray-200 focus:bg-white focus:ring-4 focus:ring-[#7A88FE]/20 focus:border-[#7A88FE] text-gray-700 cursor-pointer'}`} value={subjectId} onChange={e => setSubjectId(e.target.value)} disabled={!grade}>
                    <option value="">-- เลือกวิชา --</option>
                    {filteredSubjects.map(s => <option key={s.id} value={s.id}>{s.name} ({s.id})</option>)}
                  </select>
                  <div className={`absolute right-4 top-1/2 transform -translate-y-1/2 w-8 h-8 rounded-lg flex items-center justify-center pointer-events-none transition-colors ${!grade ? 'bg-transparent' : 'bg-white shadow-sm group-hover:bg-[#7A88FE]/10'}`}>
                    <Icon name="chevron-down" className={!grade ? 'text-gray-300' : 'text-gray-400 group-hover:text-[#7A88FE]'} size={18} />
                  </div>
                </div>
              </div>
            </div>

            {grade && subjectId && (
              <div className="overflow-x-auto fade-in">
                <table className="w-full min-w-[800px] text-left border-collapse">
                  <thead>
                    <tr className="bg-gray-100 text-gray-600 text-sm">
                      <th className="p-4 w-16 rounded-tl-xl">เลขที่</th>
                      <th className="p-4 w-24">รหัส</th>
                      <th className="p-4">ชื่อ - นามสกุล</th>
                      {type === 'ms' && (<><th className="p-4 w-64 text-center">สถานะ</th><th className="p-4 rounded-tr-xl">หมายเหตุ</th></>)}
                      {type === 'r-ms' && (<><th className="p-4 text-center">ร</th><th className="p-4 text-center">มส</th><th className="p-4 text-center rounded-tr-xl">สรุปผล</th></>)}
                      {type === '0' && (<th className="p-4 text-center rounded-tr-xl">ผลการเรียน</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {displayStudents.map((student, idx) => (
                      <tr key={student.id} className={`border-b border-gray-50 transition-colors ${formData[student.id] ? 'bg-blue-50/30' : 'hover:bg-gray-50/50'}`}>
                        <td className="p-4 text-gray-500">{idx + 1}</td>
                        <td className="p-4 text-gray-500 font-mono text-sm">{student.id}</td>
                        <td className="p-4 font-medium text-gray-700">{student.name}</td>
                        
                        {type === 'ms' && (
                          <>
                            <td className="p-4">
                              <div className="flex gap-2 justify-center">
                                {['ผ่านเกณฑ์', 'มส 80%', 'มส 60%'].map(opt => (
                                  <button key={opt} onClick={() => handleStudentChange(student.id, 'status', opt)} className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-all ${formData[student.id]?.status === opt ? (opt === 'ผ่านเกณฑ์' ? 'bg-[#CCD537] text-white shadow-md' : 'bg-[#F055A5] text-white shadow-md') : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>{opt}</button>
                                ))}
                              </div>
                            </td>
                            <td className="p-4"><input type="text" placeholder="หมายเหตุ..." className="w-full p-2 text-sm rounded-lg border border-gray-200 outline-none focus:border-[#7A88FE]" value={formData[student.id]?.note || ''} onChange={(e) => handleStudentChange(student.id, 'note', e.target.value)} /></td>
                          </>
                        )}
                         {type === 'r-ms' && (
                          <>
                            <td className="p-4 border-l border-gray-100"><div className="flex flex-col gap-1 items-center">{['ร', 'ผ่าน'].map(opt => (<label key={opt} className="flex items-center gap-2 cursor-pointer text-sm"><input type="radio" name={`r-${student.id}`} className="accent-[#FF9B28]" checked={formData[student.id]?.statusR === opt} onChange={() => handleStudentChange(student.id, 'statusR', opt)} /> {opt}</label>))}</div></td>
                            <td className="p-4 border-l border-gray-100"><div className="flex flex-col gap-1 items-center">{['มส 60%', 'มส 80%', 'ผ่าน'].map(opt => (<label key={opt} className="flex items-center gap-2 cursor-pointer text-sm"><input type="radio" name={`ms-${student.id}`} className="accent-[#F055A5]" checked={formData[student.id]?.statusMS === opt} onChange={() => handleStudentChange(student.id, 'statusMS', opt)} /> {opt}</label>))}</div></td>
                            <td className="p-4 border-l border-gray-100"><div className="flex flex-col gap-1 items-center">{['มีสิทธิ์สอบ', 'ไม่มีสิทธิ์สอบ'].map(opt => (<label key={opt} className="flex items-center gap-2 cursor-pointer text-sm font-medium"><input type="radio" name={`final-${student.id}`} className={opt === 'มีสิทธิ์สอบ' ? "accent-[#CCD537]" : "accent-[#F055A5]"} checked={formData[student.id]?.statusFinal === opt} onChange={() => handleStudentChange(student.id, 'statusFinal', opt)} /> <span className={formData[student.id]?.statusFinal === opt ? (opt === 'มีสิทธิ์สอบ' ? 'text-[#a1a82a]' : 'text-[#c94186]') : 'text-gray-500'}>{opt}</span></label>))}</div></td>
                          </>
                        )}
                        {type === '0' && (
                          <td className="p-4 text-center">
                            <div className="inline-flex bg-gray-100 rounded-lg p-1">
                              {['0', 'ปกติ'].map(opt => (<button key={opt} onClick={() => handleStudentChange(student.id, 'status', opt)} className={`px-6 py-2 rounded-md text-sm font-bold transition-all ${formData[student.id]?.status === opt ? (opt === '0' ? 'bg-[#F055A5] text-white shadow' : 'bg-[#CCD537] text-white shadow') : 'text-gray-500 hover:bg-gray-200'}`}>{opt}</button>))}
                            </div>
                          </td>
                        )}
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div className="mt-8 flex justify-end">
                  <button onClick={handleSave} disabled={isSaving} className={`px-8 py-3 rounded-xl text-white font-bold shadow-lg transition-all flex items-center gap-2 ${isSaving ? 'bg-gray-400 cursor-not-allowed' : 'bg-[#7A88FE] hover:bg-[#6574f0] hover:scale-105'}`}>
                    {isSaving ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="check" size={20} />} บันทึกผลการเรียน
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function RecordElTime({ isOpen, settings, dbData, user, showAlert, fetchAPI, reloadData }) {
      const [grade, setGrade] = useState('');
      const [subjectId, setSubjectId] = useState('');
      const [term, setTerm] = useState('');
      const [totalHours, setTotalHours] = useState('');
      const [formData, setFormData] = useState({});
      const [isSaving, setIsSaving] = useState(false);
      const [hasExistingData, setHasExistingData] = useState(false);

      if (!isOpen) {
        return (
          <div className="bg-white rounded-2xl p-10 text-center shadow-sm border border-gray-100">
            <Icon name="lock" size={48} className="mx-auto text-gray-300 mb-4" />
            <h2 className="text-2xl font-bold text-gray-700 mb-2">เมนูนี้ถูกปิดใช้งานชั่วคราว</h2>
            <p className="text-gray-500">ระบบบันทึกเวลาเรียนประถมศึกษาถูกปิดอยู่</p>
          </div>
        );
      }

      const gradeOptions = ['ป.1', 'ป.2', 'ป.3', 'ป.4', 'ป.5', 'ป.6'];
      // โค้ดกรองวิชาตามภาคเรียน (term) และระดับชั้น (grade) ฉบับสมบูรณ์
      const filteredSubjects = (dbData.elSubjects || []).filter(s => String(s.term) === String(term) && (!s.grade || String(s.grade) === String(grade)));
      const displayStudents = (dbData.elStudents || []).filter(s => s.grade === grade);

      useEffect(() => {
          if(grade && subjectId && term) {
              const existingRecords = (dbData.elTime || []).filter(t => 
                  String(t.year) === String(settings.year) && 
                  String(t.term) === String(term) && 
                  String(t.subjectId) === String(subjectId) &&
                  String(t.grade) === String(grade)
              );
              
              if(existingRecords.length > 0) {
                  setHasExistingData(true);
                  setTotalHours(existingRecords[0].totalHours);
                  let prefill = {};
                  existingRecords.forEach(r => {
                      prefill[r.studentId] = {
                          present: r.present || '', absent: r.absent || '', 
                          leave: r.leave || '', sick: r.sick || '', note: r.note || ''
                      };
                  });
                  setFormData(prefill);
              } else {
                  setHasExistingData(false);
                  setTotalHours('');
                  setFormData({});
              }
          }
      }, [grade, subjectId, term, dbData.elTime, settings.year]);

      const handleNumberChange = (studentId, field, value) => {
          setFormData(prev => ({ ...prev, [studentId]: { ...prev[studentId], [field]: value } }));
      };

      const calculatePercent = (presentVal, totalVal) => {
          const p = parseFloat(presentVal) || 0;
          const t = parseFloat(totalVal) || 0;
          if(t === 0) return 0;
          return Math.round((p / t) * 100);
      }

      const handleSave = () => {
        if (!grade || !subjectId || !term) return showAlert('แจ้งเตือน', 'กรุณาเลือกข้อมูลด้านบนให้ครบ', 'error');
        if (!totalHours) return showAlert('แจ้งเตือน', 'กรุณาระบุเวลาเรียนทั้งสิ้น', 'error');

        const recordsCount = Object.keys(formData).length;
        if (recordsCount === 0) return showAlert('แจ้งเตือน', 'คุณยังไม่ได้กรอกข้อมูลใดๆ', 'error');

        const confirmMsg = hasExistingData 
            ? `คุณต้องการอัปเดตข้อมูลใช่หรือไม่?` 
            : `ยืนยันการบันทึกเวลาเรียนจำนวน ${recordsCount} รายการ?`;

        showAlert('ยืนยันการบันทึก', confirmMsg, 'info', async () => {
          setIsSaving(true);
          try {
            const subjectName = filteredSubjects.find(s => String(s.id) === String(subjectId))?.name || '';
            const payload = Object.entries(formData).map(([sId, data]) => {
                const sName = displayStudents.find(s => String(s.id) === String(sId))?.name || '';
                const p = parseFloat(data.present) || 0;
                const percent = calculatePercent(p, totalHours);
                return {
                    year: settings.year, term, teacher: user.name, 
                    subjectId, subjectName, grade, studentId: sId, studentName: sName,
                    totalHours: parseFloat(totalHours), present: p, 
                    absent: parseFloat(data.absent)||0, leave: parseFloat(data.leave)||0, sick: parseFloat(data.sick)||0, 
                    percent, note: data.note || ''
                };
            });
            await fetchAPI('saveElTime', { data: payload });
            showAlert('สำเร็จ', 'บันทึกเวลาเรียนเรียบร้อยแล้ว', 'success');
            await reloadData();
          } catch (err) {
            showAlert('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกได้', 'error');
          } finally {
            setIsSaving(false);
          }
        });
      };

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div className="bg-[#CCD537]/10 p-6 border-b border-gray-100 flex justify-between items-center">
            <div>
              <h2 className="text-xl font-bold text-gray-800">สรุปเวลาเรียนระดับประถมศึกษา</h2>
              <p className="text-sm text-gray-500 mt-1">ปีการศึกษา {settings.year} | ครูผู้สอน: {user.name}</p>
            </div>
            {hasExistingData && <span className="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-xs font-bold border border-orange-200">มีข้อมูลในระบบแล้วสามารถแก้ไขได้</span>}
          </div>

          <div className="p-6">
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-gray-50 p-6 rounded-2xl border border-gray-100">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">ระดับชั้น</label>
                <div className="relative group">
                  <select className="w-full appearance-none px-5 py-4 rounded-xl border-2 border-gray-100 bg-white focus:ring-4 focus:ring-[#CCD537]/20 focus:border-[#CCD537] transition-all text-gray-700 font-bold cursor-pointer outline-none hover:border-gray-200" value={grade} onChange={e => {setGrade(e.target.value); setSubjectId(''); setFormData({});}}>
                    <option value="">-- เลือก --</option>
                    {gradeOptions.map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                  <div className="absolute right-4 top-1/2 transform -translate-y-1/2 w-8 h-8 bg-gray-50 rounded-lg flex items-center justify-center pointer-events-none group-hover:bg-[#CCD537]/10">
                    <Icon name="chevron-down" className="text-gray-400 group-hover:text-[#CCD537]" size={18} />
                  </div>
                </div>
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">ภาคเรียนที่</label>
                <div className="relative group">
                  <select className="w-full appearance-none px-5 py-4 rounded-xl border-2 border-gray-100 bg-white focus:ring-4 focus:ring-[#CCD537]/20 focus:border-[#CCD537] transition-all text-gray-700 font-bold cursor-pointer outline-none hover:border-gray-200" value={term} onChange={e => {setTerm(e.target.value); setSubjectId('');}}>
                    <option value="">-- เลือก --</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                  </select>
                  <div className="absolute right-4 top-1/2 transform -translate-y-1/2 w-8 h-8 bg-gray-50 rounded-lg flex items-center justify-center pointer-events-none group-hover:bg-[#CCD537]/10">
                    <Icon name="chevron-down" className="text-gray-400 group-hover:text-[#CCD537]" size={18} />
                  </div>
                </div>
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">รายวิชา</label>
                <div className="relative group">
                  <select className={`w-full appearance-none px-5 py-4 rounded-xl border-2 transition-all font-bold outline-none ${!term || !grade ? 'border-gray-100 bg-gray-100 text-gray-400 cursor-not-allowed' : 'border-gray-100 bg-white focus:ring-4 focus:ring-[#CCD537]/20 focus:border-[#CCD537] text-gray-700 cursor-pointer hover:border-gray-200'}`} value={subjectId} onChange={e => setSubjectId(e.target.value)} disabled={!term || !grade}>
                    <option value="">-- เลือกวิชา --</option>
                    {filteredSubjects.map(s => <option key={s.id} value={s.id}>{s.name} ({s.id})</option>)}
                  </select>
                  <div className={`absolute right-4 top-1/2 transform -translate-y-1/2 w-8 h-8 rounded-lg flex items-center justify-center pointer-events-none ${!term || !grade ? 'bg-transparent' : 'bg-gray-50 group-hover:bg-[#CCD537]/10'}`}>
                    <Icon name="chevron-down" className={!term || !grade ? 'text-gray-300' : 'text-gray-400 group-hover:text-[#CCD537]'} size={18} />
                  </div>
                </div>
              </div>
              <div>
                <label className="block text-sm font-bold text-[#F055A5] mb-2">เวลาเรียนทั้งสิ้น (ชั่วโมง)</label>
                <input type="number" min="0" className="w-full p-4 rounded-xl border-2 border-[#F055A5]/30 focus:border-[#F055A5] focus:ring-4 focus:ring-[#F055A5]/20 outline-none font-bold text-gray-700 transition-all" placeholder="ระบุตัวเลข" value={totalHours} onChange={e => setTotalHours(e.target.value)} />
              </div>
            </div>

            {grade && subjectId && term && (
              <div className="overflow-x-auto fade-in">
                <table className="w-full min-w-[900px] text-left border-collapse">
                  <thead>
                    <tr className="bg-[#7A88FE]/10 text-gray-700 text-sm">
                      <th className="p-3 w-12 text-center rounded-tl-xl">เลขที่</th>
                      <th className="p-3 w-20">รหัส</th>
                      <th className="p-3 w-48">ชื่อนักเรียน</th>
                      <th className="p-3 text-center border-l border-white">มาเรียน</th>
                      <th className="p-3 text-center">ขาด</th>
                      <th className="p-3 text-center">ลา</th>
                      <th className="p-3 text-center">ป่วย</th>
                      <th className="p-3 text-center bg-[#CCD537]/20 border-l border-white">ร้อยละ (%)</th>
                      <th className="p-3 w-32 border-l border-white rounded-tr-xl">หมายเหตุ</th>
                    </tr>
                  </thead>
                  <tbody>
                    {displayStudents.map((student, idx) => {
                      const sd = formData[student.id] || {};
                      const percent = calculatePercent(sd.present, totalHours);
                      const isLow = percent < 80 && percent > 0;
                      return (
                        <tr key={student.id} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                            <td className="p-2 text-center text-gray-500">{idx + 1}</td>
                            <td className="p-2 text-gray-500 text-sm">{student.id}</td>
                            <td className="p-2 font-medium text-gray-700 text-sm truncate">{student.name}</td>
                            <td className="p-2 border-l border-gray-100"><input type="number" min="0" className="w-full p-2 text-center rounded border border-gray-200 outline-none focus:border-[#CCD537]" placeholder="0" value={sd.present || ''} onChange={e => handleNumberChange(student.id, 'present', e.target.value)} /></td>
                            <td className="p-2"><input type="number" min="0" className="w-full p-2 text-center rounded border border-gray-200 outline-none focus:border-[#F055A5]" placeholder="0" value={sd.absent || ''} onChange={e => handleNumberChange(student.id, 'absent', e.target.value)} /></td>
                            <td className="p-2"><input type="number" min="0" className="w-full p-2 text-center rounded border border-gray-200 outline-none focus:border-[#FF9B28]" placeholder="0" value={sd.leave || ''} onChange={e => handleNumberChange(student.id, 'leave', e.target.value)} /></td>
                            <td className="p-2"><input type="number" min="0" className="w-full p-2 text-center rounded border border-gray-200 outline-none focus:border-[#BFDFF3]" placeholder="0" value={sd.sick || ''} onChange={e => handleNumberChange(student.id, 'sick', e.target.value)} /></td>
                            <td className="p-2 border-l border-gray-100 bg-gray-50/50 text-center">
                                <span className={`font-bold ${isLow ? 'text-red-500' : 'text-[#7A88FE]'}`}>{totalHours ? `${percent}%` : '-'}</span>
                            </td>
                            <td className="p-2 border-l border-gray-100"><input type="text" className="w-full p-2 text-sm rounded border border-gray-200 outline-none focus:border-[#CCD537]" placeholder="ระบุ..." value={sd.note || ''} onChange={e => handleNumberChange(student.id, 'note', e.target.value)} /></td>
                        </tr>
                      )
                    })}
                  </tbody>
                </table>
                <div className="mt-6 flex justify-end">
                  <button onClick={handleSave} disabled={isSaving} className={`px-8 py-3 rounded-xl text-white font-bold shadow-lg transition-all flex items-center gap-2 ${isSaving ? 'bg-gray-400' : 'bg-[#CCD537] hover:bg-[#b8c227] hover:scale-105'}`}>
                    {isSaving ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="check" size={20} />} บันทึกเวลาเรียน
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ReportsSystem({ isOpen, settings, dbData, showAlert }) {
      const [reportType, setReportType] = useState(null); 
      const [selectedGrade, setSelectedGrade] = useState('');
      const [selectedStudent, setSelectedStudent] = useState('');
      
      const [elReportType, setElReportType] = useState(null); 
      const [elGrade, setElGrade] = useState('');
      const [elTerm, setElTerm] = useState('ตลอดปีการศึกษา');
      const [elStudent, setElStudent] = useState('');
      const [elSubject, setElSubject] = useState('');

      const [preview, setPreview] = useState(false);

      if (!isOpen) {
        return (
          <div className="bg-white rounded-2xl p-10 text-center shadow-sm border border-gray-100">

          </div>
        );
      }

      const gradeOptions = [...new Set((dbData.students || []).map(s => s.grade))].sort();
      const studentsInGrade = (dbData.students || []).filter(s => s.grade === selectedGrade);

      const elGradeOptions = ['ป.1', 'ป.2', 'ป.3', 'ป.4', 'ป.5', 'ป.6'];
      const elStudentsInGrade = (dbData.elStudents || []).filter(s => s.grade === elGrade);
      const elSubjectsInGrade = [...new Set((dbData.elTime || []).filter(t=>t.grade === elGrade).map(t=>t.subjectId))].map(id => {
          return (dbData.elTime || []).find(t => t.subjectId === id);
      });

      const handleSelectReport = (type, category) => {
        setPreview(false);
        if(category === 'sec') {
            setReportType(type); setElReportType(null);
            setSelectedGrade(''); setSelectedStudent('');
            if (type === 'all') setPreview(true);
        } else {
            setElReportType(type); setReportType(null);
            setElGrade(''); setElStudent(''); setElSubject(''); setElTerm('ตลอดปีการศึกษา');
        }
      };

      const handleShowPreview = (category) => {
        if(category === 'sec') {
            if (reportType === 'room' && !selectedGrade) return showAlert('แจ้งเตือน', 'กรุณาเลือกระดับชั้น', 'error');
            if (reportType === 'individual' && (!selectedGrade || !selectedStudent)) return showAlert('แจ้งเตือน', 'กรุณาเลือกข้อมูลให้ครบถ้วน', 'error');
        } else {
            if (!elGrade) return showAlert('แจ้งเตือน', 'กรุณาเลือกระดับชั้น', 'error');
            if (elReportType === 'el-indiv' && !elStudent) return showAlert('แจ้งเตือน', 'กรุณาเลือกนักเรียน', 'error');
            if (elReportType === 'el-sub' && !elSubject) return showAlert('แจ้งเตือน', 'กรุณาเลือกวิชา', 'error');
        }
        setPreview(true);
      };

      const SignatureTable = () => (
        <div className="break-inside-avoid mt-4">
          <table className="w-full border-collapse mt-2 text-[11px] font-normal font-sarabun text-black" style={{border: 'none'}}>
            <tbody>
              <tr className="break-inside-avoid">
                <td className="py-4 text-center w-1/2 align-bottom" style={{border: 'none'}}>(ลงชื่อ)...................................................<br/>(นายนิติพงศ์ คงทอง)<br/>ผู้รายงาน</td>
                <td className="py-4 text-center w-1/2 align-bottom" style={{border: 'none'}}>(ลงชื่อ)....................................................<br/>(นางดุษฎี บุญส่ง)<br/>หัวหน้าฝ่ายบริหารวิชาการ</td>
              </tr>
              <tr className="break-inside-avoid">
                <td className="py-4 text-center w-1/2 align-bottom" style={{border: 'none'}}>(ลงชื่อ).....................................................<br/>(นางมธุรส รัตนะ)<br/>หัวหน้างานวัดผล</td>
                <td className="py-4 text-center w-1/2 align-bottom" style={{border: 'none'}}>(ลงชื่อ).....................................................<br/>(นางทิพยา ชูจิตร)<br/>ผู้อำนวยการโรงเรียนทรัพย์ทวี</td>
              </tr>
            </tbody>
          </table>
        </div>
      );

      let secData = [];
      if (preview && reportType) {
        let gradesToProcess = [];
        if (reportType === 'individual') gradesToProcess = (dbData.grades || []).filter(g => String(g.studentId) === String(selectedStudent));
        else if (reportType === 'room') {
          const roomStudentIds = studentsInGrade.map(s => String(s.id));
          gradesToProcess = (dbData.grades || []).filter(g => roomStudentIds.includes(String(g.studentId)));
        } 
        else gradesToProcess = dbData.grades || [];

        secData = gradesToProcess.map(g => {
          const student = dbData.students.find(s => String(s.id) === String(g.studentId)) || {};
          const subject = dbData.subjects.find(s => String(s.id) === String(g.subjectId)) || {};
          return { ...g, studentName: student.name || 'ไม่พบข้อมูล', grade: student.grade || '', subjectName: subject.name || 'ไม่พบวิชา' };
        }).sort((a, b) => String(a.studentId).localeCompare(String(b.studentId)));

      let elData = [];
      if(preview && elReportType) {
          let baseData = (dbData.elTime || []).filter(t => t.grade === elGrade);
          if (elTerm !== 'ตลอดปีการศึกษา') {
              baseData = baseData.filter(t => String(t.term) === String(elTerm));

          if (elReportType === 'el-indiv') baseData = baseData.filter(t => String(t.studentId) === String(elStudent));
          else if (elReportType === 'el-sub') baseData = baseData.filter(t => String(t.subjectId) === String(elSubject));

                      <div className="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none"><Icon name="chevron-down" className="text-gray-400" size={16} /></div>

                </div>
              </div>

              <button onClick={() => handleSelectReport('el-room', 'pri')} className={`p-6 rounded-xl border-2 text-left transition-all ${elReportType === 'el-room' ? 'border-[#CCD537] bg-[#CCD537]/10' : 'border-gray-100 hover:border-[#CCD537]'}`}><h3 className="font-bold text-lg text-gray-700">2. รายชั้นเรียน</h3></button>
              <button onClick={() => handleSelectReport('el-sub', 'pri')} className={`p-6 rounded-xl border-2 text-left transition-all ${elReportType === 'el-sub' ? 'border-[#CCD537] bg-[#CCD537]/10' : 'border-gray-100 hover:border-[#CCD537]'}`}><h3 className="font-bold text-lg text-gray-700">3. รายวิชา</h3></button>

            {elReportType && !preview && (

                    <div className="relative group">
                      <select className="w-full appearance-none px-5 py-3 rounded-lg border border-gray-300 outline-none focus:border-[#CCD537]" value={elTerm} onChange={e => setElTerm(e.target.value)}>
                          <option value="ตลอดปีการศึกษา">ตลอดปีการศึกษา</option>

                      </select>
                      <div className="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none"><Icon name="chevron-down" className="text-gray-400" size={16} /></div>
                    </div>
                  </div>
                  <div className="w-full md:w-1/4">
                    <label className="block text-sm font-medium mb-2">ระดับชั้น</label>
                    <div className="relative group">
                      <select className="w-full appearance-none px-5 py-3 rounded-lg border border-gray-300 outline-none focus:border-[#CCD537]" value={elGrade} onChange={e => {setElGrade(e.target.value); setElStudent(''); setElSubject('');}}>
                          <option value="">-- เลือก --</option>{elGradeOptions.map(g => <option key={g} value={g}>{g}</option>)}
                      </select>
                      <div className="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none"><Icon name="chevron-down" className="text-gray-400" size={16} /></div>
                    </div>
                  </div>
                  {elReportType === 'el-indiv' && (
                    <div className="w-full md:w-1/3">
                      <label className="block text-sm font-medium mb-2">รายชื่อ</label>
                      <div className="relative group">
                        <select className="w-full appearance-none px-5 py-3 rounded-lg border border-gray-300 outline-none focus:border-[#CCD537]" value={elStudent} onChange={e => setElStudent(e.target.value)} disabled={!elGrade}>
                          <option value="">-- เลือก --</option>{elStudentsInGrade.map(s => <option key={s.id} value={s.id}>{s.id} - {s.name}</option>)}
                        </select>
                        <div className="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none"><Icon name="chevron-down" className="text-gray-400" size={16} /></div>
                      </div>
                    </div>
                  )}
                  {elReportType === 'el-sub' && (
                    <div className="w-full md:w-1/3">
                      <label className="block text-sm font-medium mb-2">วิชา</label>
                      <div className="relative group">
                        <select className="w-full appearance-none px-5 py-3 rounded-lg border border-gray-300 outline-none focus:border-[#CCD537]" value={elSubject} onChange={e => setElSubject(e.target.value)} disabled={!elGrade}>
                          <option value="">-- เลือก --</option>{elSubjectsInGrade.map(s => <option key={s.subjectId} value={s.subjectId}>{s.subjectName}</option>)}
                        </select>
                        <div className="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none"><Icon name="chevron-down" className="text-gray-400" size={16} /></div>
                      </div>
                    </div>
                  )}
                  <button onClick={()=>handleShowPreview('pri')} className="px-6 py-3 bg-[#CCD537] text-white font-bold rounded-lg w-full md:w-auto hover:bg-[#b8c227] transition-colors shadow-md">ดูรายงาน</button>
                </div>
              </div>
            )}
          </div>

          {preview && (
            <div className="bg-gray-200 p-4 md:p-8 rounded-2xl flex flex-col items-center print-wrapper fade-in mt-6">
              <div className="w-full max-w-[210mm] flex justify-end gap-3 mb-4 no-print">
                <button onClick={() => window.print()} className="bg-[#7A88FE] text-white px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2 transition-transform hover:scale-105"><Icon name="printer" size={18} /> พิมพ์รายงาน</button>
              </div>

              <div className="w-full overflow-auto a4-scroll flex justify-center pb-8 print-container" style={{maxHeight: '70vh'}}>
                <div id="printable-area" className="bg-white text-black font-sarabun font-normal flex flex-col shadow-sm" style={{width: '210mm', minHeight: '297mm', height: 'max-content', padding: '1cm', position: 'relative'}}>
                  
                  <div className="text-center mb-6">
                    <div className="text-[14px] font-normal">โรงเรียนทรัพย์ทวี</div>
                    <div className="text-[14px] font-normal">
                        {reportType ? 'รายงานผลการเรียนและติดตามความก้าวหน้า' : 'รายงานสรุปเวลาเรียนระดับประถมศึกษา'}
                    </div>
                    {reportType === 'room' && <div className="text-[12px] font-normal mt-1">ชั้น {selectedGrade}</div>}
                    {elReportType === 'el-room' && <div className="text-[12px] font-normal mt-1">ชั้น {elGrade} {elTerm!=='ตลอดปีการศึกษา'?`ภาคเรียนที่ ${elTerm}`:''}</div>}
                    {elReportType === 'el-sub' && <div className="text-[12px] font-normal mt-1">วิชา {elData[0]?.subjectName || elSubject} ชั้น {elGrade} {elTerm!=='ตลอดปีการศึกษา'?`ภาคเรียนที่ ${elTerm}`:''}</div>}
                  </div>

                  {reportType === 'individual' && (
                    <div className="flex flex-col flex-1">
                      <div className="flex justify-between mb-4 px-1 text-[11px] font-normal">
                        <span>เลขประจำตัว: {selectedStudent}</span>
                        <span>ชื่อ-สกุล: {dbData.students.find(s=>s.id==selectedStudent)?.name}</span>
                        <span>ชั้น: {selectedGrade}</span>
                      </div>
                      <table className="w-full border-collapse mb-2 font-normal text-[11px] text-black">
                        <thead><tr className="border-y border-black"><th className="py-1 text-left">รหัสวิชา</th><th className="py-1 text-left">วิชา</th><th className="py-1 text-left">ครูผู้สอน</th><th className="py-1 text-center">ผลการเรียน</th><th className="py-1 text-center">หมายเหตุ</th></tr></thead>
                        <tbody>
                          {secData.map((row, i) => (
                              <tr key={i} className="border-b border-black break-inside-avoid">

                      <div className="mt-auto pt-4 break-inside-avoid"><SignatureTable /></div>
                    </div>

                  {(reportType === 'room' || reportType === 'all') && (

                        <tbody>
                          {secData.map((row, i) => (

                                <td className="py-1 text-center">{row.studentId}</td><td className="py-1 text-left">{row.studentName}</td><td className="py-1 text-center">{row.grade}</td><td className="py-1 text-left">{row.subjectId}</td><td className="py-1 text-left">{row.subjectName}</td><td className="py-1 text-left">{row.teacher}</td><td className="py-1 text-center">{row.status || row.statusR || row.statusMS}</td><td className="py-1 text-center">{row.note || row.statusFinal}</td>
