                     <div className="flex flex-col flex-1">
                     <table className="w-full border-collapse mb-2 font-normal text-[11px] text-black">
                       <thead><tr className="border-y border-black"><th className="py-1 text-center">รหัสนร.</th><th className="py-1 text-left w-32">ชื่อ-สกุล</th><th className="py-1 text-center">เทอม</th>{elReportType==='el-room' && <th className="py-1 text-left">วิชา</th>}<th className="py-1 text-center">เต็ม</th><th className="py-1 text-center">มา</th><th className="py-1 text-center">ขาด</th><th className="py-1 text-center">ลา</th><th className="py-1 text-center">ป่วย</th><th className="py-1 text-center">%</th></tr></thead>
                       <tbody>
                         {elData.map((row, i) => (
                             <tr key={i} className="border-b border-black break-inside-avoid">
                               <td className="py-1 text-center">{row.studentId}</td><td className="py-1 text-left">{row.studentName}</td><td className="py-1 text-center">{row.term}</td>
                               {elReportType==='el-room' && <td className="py-1 text-left">{row.subjectName}</td>}
                               <td className="py-1 text-center">{row.totalHours}</td><td className="py-1 text-center">{row.present}</td><td className="py-1 text-center">{row.absent}</td><td className="py-1 text-center">{row.leave}</td><td className="py-1 text-center">{row.sick}</td>
                               <td className="py-1 text-center font-bold">{row.percent}</td>
                             </tr>
                         ))}
                         {elData.length === 0 && <tr><td colSpan="10" className="text-center py-4">ไม่มีข้อมูล</td></tr>}
                       </tbody>
                     </table>
                     <div className="text-right mt-2 text-[10px]">{printDateTime}</div>
                     <div className="mt-auto pt-4 break-inside-avoid"><SignatureTable /></div>
                   </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AdminSettings({ settings, setSettings, fetchAPI, showAlert }) {
      const [localSettings, setLocalSettings] = useState(settings);
      const [isSaving, setIsSaving] = useState(false);

      const toggleOptions = [
          { key: 'isRecordMSOpen', label: 'บันทึกผลนักเรียนติด มส' },
          { key: 'isRecordElTimeOpen', label: 'บันทึกเวลาเรียนประถม' },
          { key: 'isRecordRMsOpen', label: 'บันทึกยืนยันผล ร มส' },
          { key: 'isRecord0Open', label: 'บันทึกยืนยันผล 0' },
          { key: 'isPrintOpen', label: 'ระบบพิมพ์รายงาน' },
      ]

      const saveSettings = async () => {
        setIsSaving(true);
        try {
          const payload = {};
          Object.keys(localSettings).forEach(k => {
              payload[k] = typeof localSettings[k] === 'boolean' ? String(localSettings[k]) : localSettings[k];
          });
          
          await fetchAPI('saveSettings', { data: payload });
          setSettings(localSettings);
          showAlert('สำเร็จ', 'บันทึกการตั้งค่าระบบเรียบร้อยแล้ว', 'success');
        } catch (error) {
          showAlert('ผิดพลาด', 'ไม่สามารถบันทึกการตั้งค่าได้', 'error');
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 min-h-[500px]">
          <h2 className="text-2xl font-bold text-gray-800 mb-6 border-l-4 border-[#7A88FE] pl-3">การจัดการระบบ (Admin)</h2>
          
          <div className="max-w-2xl space-y-6 fade-in">
            <div className="grid grid-cols-2 gap-4">
              <div><label className="block text-sm font-bold text-gray-700 mb-2">ปีการศึกษาปัจจุบัน</label><input type="text" className="w-full p-3 rounded-lg border border-gray-300 outline-none focus:border-[#7A88FE]" value={localSettings.year} onChange={e => setLocalSettings({...localSettings, year: e.target.value})} /></div>
              <div><label className="block text-sm font-bold text-gray-700 mb-2">ภาคเรียนปัจจุบัน</label><input type="text" className="w-full p-3 rounded-lg border border-gray-300 outline-none focus:border-[#7A88FE]" value={localSettings.term} onChange={e => setLocalSettings({...localSettings, term: e.target.value})} /></div>
            </div>
            
            <h3 className="font-bold text-gray-700 border-b pb-2 pt-4">เปิด/ปิด เมนูระบบ (On/Off Toggles)</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {toggleOptions.map(opt => (
                    <label key={opt.key} className="flex items-center justify-between p-4 border border-gray-100 rounded-xl bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors">
                        <span className="font-bold text-gray-700 text-sm">{opt.label}</span>
                        <input type="checkbox" className="w-5 h-5 accent-[#7A88FE]" checked={localSettings[opt.key]} onChange={e => setLocalSettings({...localSettings, [opt.key]: e.target.checked})} />
                    </label>
                ))}
            </div>

            <button onClick={saveSettings} disabled={isSaving} className="mt-6 px-8 py-3 bg-[#7A88FE] text-white font-bold rounded-lg hover:bg-[#6574f0] transition-colors shadow-md">
              {isSaving ? 'กำลังบันทึก...' : 'บันทึกการตั้งค่าทั้งหมด'}
            </button>
          </div>
        </div>
      );
    }

    function AlertModal({ title, message, type, onClose, onConfirm }) {
      const colorClass = type === 'success' ? 'text-[#CCD537]' : type === 'error' ? 'text-[#F055A5]' : 'text-[#FABE37]';
      const btnClass = type === 'success' ? 'bg-[#CCD537]' : type === 'error' ? 'bg-[#F055A5]' : 'bg-[#7A88FE]';
      const iconName = type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'alert-circle';
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm slide-in alert-modal">
          <div className="bg-white rounded-2xl p-6 md:p-8 max-w-sm w-full shadow-2xl relative overflow-hidden">
            <div className={`absolute top-0 left-0 w-full h-1.5 ${btnClass}`}></div>
            <div className="text-center">
              <Icon name={iconName} size={56} className={`mx-auto mb-4 ${colorClass}`} />
              <h3 className="text-xl font-bold text-gray-800 mb-2">{title}</h3>
              <p className="text-gray-600 mb-8">{message}</p>
              <div className="flex gap-3 justify-center">
                {onConfirm && <button onClick={() => { onConfirm(); onClose(); }} className={`px-6 py-2.5 rounded-xl text-white font-bold transition-transform hover:scale-105 shadow-md ${btnClass}`}>ยืนยัน</button>}
                <button onClick={onClose} className={`px-6 py-2.5 rounded-xl font-bold transition-colors ${onConfirm ? 'bg-gray-100 text-gray-700 hover:bg-gray-200' : `${btnClass} text-white shadow-md`}`}>{onConfirm ? 'ยกเลิก' : 'ตกลง'}</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
